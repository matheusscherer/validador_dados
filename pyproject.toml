[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validador-dados"
version = "0.1.0"
description = "Auditoria automatizada de dados: duplicatas, nulos, outliers, erros de cálculo e relatório"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matheus Scherer", email = "contatomatheusscherer@gmail.com" }]
keywords = ["python", "auditoria", "dados", "pandas", "qualidade", "validacao"]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
validador-dados = "validador_dados.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
